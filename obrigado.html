  <style>
    .ty-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      background:
        radial-gradient(ellipse at top, rgba(238,27,36,.12), transparent 50%),
        linear-gradient(180deg, #fff 0%, #fafafa 100%);
      position: relative;
      overflow: hidden;
    }
    .ty-wrap::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
    }
    .ty-card {
      position: relative;
      max-width: 600px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--ink-100);
      border-radius: var(--radius-xl);
      padding: clamp(36px, 5vw, 56px);
      text-align: center;
      box-shadow: 0 30px 70px -20px rgba(0,0,0,.18);
    }
    .ty-logo { height: 48px; margin: 0 auto 24px; }
    .ty-icon {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: #fff;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-red);
      animation: pop .8s cubic-bezier(.16,1,.3,1);
    }
    @keyframes pop {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }
    .ty-card h1 {
      font-family: var(--font-heading);
      font-size: clamp(28px, 3.5vw, 40px);
      font-weight: 600;
      line-height: 1.1;
      color: var(--ink-900);
      margin-bottom: 14px;
      letter-spacing: -.015em;
    }
    .ty-card p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-500);
      margin-bottom: 28px;
    }
    .ty-ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .ty-back { display: inline-block; margin-top: 22px; font-size: 14px; color: var(--ink-400); }
    .ty-back:hover { color: var(--red); }
  </style>
